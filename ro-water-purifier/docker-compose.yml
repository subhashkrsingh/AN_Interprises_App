services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-admin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: ecommerce-admin-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce_admin?schema=public
      JWT_SECRET: change-this-access-secret
      JWT_REFRESH_SECRET: change-this-refresh-secret
      COOKIE_SECURE: "false"
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/server/uploads

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: ecommerce-admin-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_ADMIN_API_URL: http://localhost:5000/api/admin
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  uploads:
